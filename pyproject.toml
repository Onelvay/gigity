[project]
name = "touchline-lab"
version = "0.1.0"
description = "Evidence-based Premier League match analysis with event data, interpretable ML and grounded LLM reports"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
